<section class="container py-4 py-md-5">
  <div class="text-center mb-4 mb-md-5">
    <span class="page-eyebrow">Our Collection</span>
    <h1 class="page-title gold-gradient-text">Shop Jewellery</h1>
    <p class="text-muted-light mb-0">Hand-picked pieces, curated for elegance.</p>
  </div>

  <!-- Filters -->
  <div class="filter-bar mb-4">
    <div class="search-wrap">
      <i class="bi bi-search"></i>
      <input
        type="search"
        class="form-control"
        placeholder="Search jewellery, material..."
        [ngModel]="search()"
        (ngModelChange)="search.set($event)">
    </div>

    <div class="d-flex gap-2 align-items-center">
      <select class="form-select"
              [ngModel]="sort()"
              (ngModelChange)="setSort($event)">
        <option value="new">Sort: Newest</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
      </select>
    </div>
  </div>

  <div class="cat-pills mb-4">
    <button *ngFor="let c of categories()"
            class="cat-pill"
            [class.active]="category() === c"
            (click)="setCategory(c)">
      {{ c }}
    </button>
  </div>

  <div class="spinner-gold" *ngIf="loading()"></div>

  <div class="row g-3 g-md-4" *ngIf="!loading()">
    <div class="col-6 col-md-4 col-lg-3" *ngFor="let p of filtered()">
      <app-product-card [product]="p"></app-product-card>
    </div>
    <div *ngIf="filtered().length === 0" class="col-12 text-center py-5 text-muted-light">
      <i class="bi bi-emoji-frown fs-1 d-block mb-2 text-gold"></i>
      No products match your filters.
    </div>
  </div>
</section>
