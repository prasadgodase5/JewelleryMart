<a [routerLink]="['/product', product.id]" class="text-decoration-none d-block h-100">
  <div class="luxury-card product-card h-100 d-flex flex-column">
    <div class="product-thumb">
      <div class="img-shimmer" *ngIf="!imgLoaded"></div>
      <img
        [src]="product.images?.[0] || 'assets/placeholder.svg'"
        [alt]="product.name"
        loading="lazy"
        decoding="async"
        (load)="imgLoaded = true"
        [class.is-loaded]="imgLoaded">
      <span class="badge-featured" *ngIf="product.featured">Featured</span>
      <span class="badge-soldout" *ngIf="product.inStock === false">Sold Out</span>
    </div>
    <div class="p-3 d-flex flex-column flex-grow-1">
      <h5 class="product-name mb-1">{{ product.name }}</h5>
      <small class="text-muted-light mb-2">{{ product.material }}</small>
      <div class="d-flex justify-content-between align-items-center mt-auto pt-2">
        <span class="price gold-gradient-text">₹{{ product.price | number }}</span>
        <span class="view-link">View <i class="bi bi-arrow-right"></i></span>
      </div>
    </div>
  </div>
</a>
