<section class="categories-page">
  <div class="page-head">
    <h2>Categories</h2>
    <button type="button" class="app-btn app-btn-primary" (click)="openCreate()">
      <i class="bi bi-plus-lg"></i> Add Category
    </button>
  </div>

  <div class="app-card">
    <input class="app-input search-input"
           placeholder="Search categories…"
           [value]="search()"
           (input)="setSearch($any($event.target).value)" />

    <div class="table-wrap">
      <table class="app-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Description</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of paged()">
            <td class="font-medium">{{ c.name }}</td>
            <td class="muted">{{ c.description || '—' }}</td>
            <td class="text-end actions">
              <button type="button" class="app-btn app-btn-ghost" (click)="openEdit(c)">
                <i class="bi bi-pencil"></i> Edit
              </button>
              <button type="button" class="app-btn app-btn-ghost danger-text" (click)="remove(c)">
                <i class="bi bi-trash"></i> Delete
              </button>
            </td>
          </tr>
          <tr *ngIf="!paged().length">
            <td colspan="3" class="empty">No categories</td>
          </tr>
        </tbody>
      </table>
    </div>

    <app-pagination
      [total]="filtered().length"
      [page]="page()"
      [pageSize]="pageSize"
      (pageChange)="page.set($event)"></app-pagination>
  </div>
</section>

<app-modal [open]="showModal()"
           [title]="editing() ? 'Edit Category' : 'Add Category'"
           (close)="closeModal()">
  <form [formGroup]="form" (ngSubmit)="save()" novalidate class="form-stack">
    <div>
      <label class="app-label">Name<span class="req">*</span></label>
      <input type="text" class="app-input" formControlName="name"
             placeholder="e.g. Electronics"
             [class.is-invalid]="hasError('name')" />
      <p class="error-msg" *ngIf="hasError('name', 'required')">Name is required.</p>
      <p class="error-msg" *ngIf="hasError('name', 'minlength')">At least 2 characters required.</p>
      <p class="error-msg" *ngIf="hasError('name', 'maxlength')">Maximum 60 characters allowed.</p>
    </div>

    <div>
      <label class="app-label">Description</label>
      <textarea class="app-input" rows="3" formControlName="description"
                placeholder="Optional description"
                [class.is-invalid]="hasError('description')"></textarea>
      <p class="error-msg" *ngIf="hasError('description', 'maxlength')">Maximum 200 characters.</p>
    </div>

    <div class="form-actions">
      <button type="button" class="app-btn app-btn-secondary" (click)="closeModal()">Cancel</button>
      <button type="submit" class="app-btn app-btn-primary">
        {{ editing() ? 'Update' : 'Create' }}
      </button>
    </div>
  </form>
</app-modal>
