<div class="layout-shell">
  <aside class="sidebar"
         [class.is-open]="sidebarOpen()"
         [class.is-mobile]="isSmall()">
    <div class="sidebar-brand">
      <div class="brand-logo">
        <i class="bi bi-bag-heart-fill"></i>
      </div>
      <div class="brand-text">
        <div class="brand-title">PG E-Mart</div>
        <div class="brand-subtitle">{{ auth.role() === 'admin' ? 'Admin Console' : 'Shop Smart' }}</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a *ngFor="let item of nav()"
         [routerLink]="item.route"
         routerLinkActive="active"
         (click)="closeOnMobile()"
         class="sidebar-link">
        <i class="bi {{ item.icon }}"></i>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button type="button" class="sidebar-logout" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i>
        <span>Sign Out</span>
      </button>
      <div class="sidebar-version">v1.0 · {{ today | date:'mediumDate' }}</div>
    </div>
  </aside>

  <div class="sidebar-backdrop"
       *ngIf="sidebarOpen() && isSmall()"
       (click)="sidebarOpen.set(false)"></div>

  <div class="main-pane">
    <header class="topbar">
      <button type="button"
              class="app-btn app-btn-ghost menu-toggle"
              (click)="toggleSidebar()"
              aria-label="Toggle menu">
        <i class="bi bi-list"></i>
      </button>

      <div class="topbar-title">
        <h1>{{ pageTitle() }}</h1>
        <p>{{ pageSubtitle() }}</p>
      </div>

      <div class="user-menu-wrap">
        <button type="button" class="user-trigger" (click)="toggleUserMenu()">
          <div class="user-avatar">{{ initial() }}</div>
          <div class="user-meta">
            <span class="user-name">{{ auth.username() }}</span>
            <span class="user-role-badge"
                  [ngClass]="auth.role() === 'admin' ? 'role-admin' : 'role-user'">
              {{ auth.role() }}
            </span>
          </div>
          <i class="bi bi-chevron-down user-caret"></i>
        </button>

        <div class="user-menu" *ngIf="userMenuOpen()">
          <div class="um-header">
            <div class="um-avatar">{{ initial() }}</div>
            <div>
              <div class="um-name">{{ auth.username() }}</div>
              <div class="um-phone">📱 {{ auth.phone() }}</div>
            </div>
          </div>
          <button type="button" class="um-item danger" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i> Sign Out
          </button>
        </div>
      </div>
    </header>

    <main class="content-area">
      <ng-content></ng-content>
    </main>
  </div>
</div>

<app-confirm-dialog></app-confirm-dialog>
